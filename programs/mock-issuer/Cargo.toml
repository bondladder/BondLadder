[package]
name = "mock-issuer"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "mock_issuer"

[lints]
workspace = true

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }


[dev-dependencies]
mollusk-svm = "0.15.0"
mollusk-svm-programs-token = { version = "0.15.0", default-features = false, features = [
  "token",
] }
solana-account = "4.3.2"
solana-address = "2.6.1"
solana-instruction = "3.4.1"
solana-instruction-error = "2.4.0"
solana-program-pack = "3.1.0"
spl-token-interface = "2.0.0"
