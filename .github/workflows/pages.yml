name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Everything prefixed VITE_ is baked into the bundle and is public by design.
      # Program ids match Anchor.toml; the RPC URL falls back to the public devnet
      # endpoint unless the repository provides its own (a key restricted to the
      # Pages origin is the right kind).
      VITE_SOLANA_RPC_URL: ${{ secrets.VITE_SOLANA_RPC_URL || 'https://api.devnet.solana.com' }}
      VITE_SOLANA_CLUSTER: ${{ vars.VITE_SOLANA_CLUSTER || 'devnet' }}
      VITE_BOND_LADDER_PROGRAM_ID: ${{ vars.VITE_BOND_LADDER_PROGRAM_ID || '5aKvW5hFUGw5hKzpz5DRYBK26EADqRHHgknmCU1EGNHe' }}
      VITE_RATING_ORACLE_PROGRAM_ID: ${{ vars.VITE_RATING_ORACLE_PROGRAM_ID || 'EWhJjvNVb5mh1Jb9DTzvTwk7BeS9qdZdK7a6vdneQPa9' }}
      VITE_MOCK_ISSUER_PROGRAM_ID: ${{ vars.VITE_MOCK_ISSUER_PROGRAM_ID || 'EX1tNj2MLTacJPfAVzbBW8ejFsnSp7AsnZvnRLmDy3vK' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Not `pnpm gate`: typechecking `scripts` needs target/types from `anchor build`,
      # and the Solana toolchain has no business on a static-site deploy. Its tests
      # still run — the target/ imports there are type-only.
      - run: pnpm lint
      - run: pnpm --filter '!@bondladder/scripts' typecheck
      - run: pnpm -r test

      # A project site lives under /<repo>/: the landing (static, no build) at the
      # root and the app under /<repo>/app/, so the bundle is built for that base.
      - run: pnpm --filter @bondladder/web exec vite build --base="/${{ github.event.repository.name }}/app/"

      # Pages has no SPA fallback and serves a custom 404 only from the site root,
      # so the root 404.html is the app's own shell: a direct hit on
      # /<repo>/app/exit gets it and the router takes over. Until the move the
      # app lived at /<repo>/ itself, and links to /<repo>/exit are out there; the
      # shell first sends any path outside app/ to the same route inside it.
      - name: Assemble the site
        env:
          REPO: ${{ github.event.repository.name }}
        run: |
          mkdir -p site
          cp -r apps/landing/. site/
          cp -r apps/web/dist site/app
          guard="<script>if(location.pathname.indexOf('/${REPO}/app/')!==0)location.replace('/${REPO}/app/'+location.pathname.slice('/${REPO}/'.length)+location.search+location.hash)</script>"
          sed "s|<head>|<head>${guard}|" apps/web/dist/index.html > site/404.html
          grep -qF "$guard" site/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
